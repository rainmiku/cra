name: Release

# Cut a release by pushing a tag: git tag v0.1.0 && git push origin v0.1.0
# Signing and notarization run when the secrets below exist; otherwise the
# job publishes an ad-hoc build with install steps from release-notes-unsigned.md.
#
# Secrets (Settings → Secrets and variables → Actions):
#   MACOS_CERTIFICATE_P12        base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD   password of that .p12
#   MACOS_SIGN_IDENTITY          e.g. "Developer ID Application: Victor Kildahl (TEAMID)"
#   APPLE_ID                     Apple ID used for notarization
#   APPLE_TEAM_ID                10-character team id
#   APPLE_APP_PASSWORD           app-specific password for that Apple ID
#   SPARKLE_PRIVATE_KEY          Sparkle EdDSA private key (generate_keys -x), signs appcast.xml
# Variable (same page, Variables tab):
#   SPARKLE_PUBLIC_KEY           its public key (generate_keys -p); turns on in-app updates

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (without the v)
        required: true
        default: 0.1.0

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, notarize, publish
    runs-on: macos-15
    env:
      CRA_VERSION: ${{ github.event.inputs.version || github.ref_name }}
      # The secrets context is not allowed in step `if`s, so resolve it once here.
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
      # In-app updates read the newest release's appcast.xml (scripts/appcast.sh).
      CRA_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      CRA_UPDATE_FEED_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/appcast.xml
    steps:
      - uses: actions/checkout@v7

      - name: Normalise version
        run: echo "CRA_VERSION=${CRA_VERSION#v}" >> "$GITHUB_ENV"

      - name: Read pinned CEF version
        id: cef
        run: echo "version=$(sed -n 's/^CEF_VERSION="${CEF_VERSION:-\(.*\)}"$/\1/p' scripts/fetch-cef.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache CEF
        uses: actions/cache@v6
        with:
          path: vendor/cef
          key: cef-${{ runner.arch }}-${{ steps.cef.outputs.version }}

      - name: Import signing certificate
        id: cert
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build, sign, notarize, package
        env:
          CRA_SIGN_IDENTITY: ${{ steps.cert.outputs.signed == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/release.sh

      - name: Sparkle appcast
        if: ${{ env.CRA_SPARKLE_PUBLIC_KEY != '' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          CRA_DOWNLOAD_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          # Without the feed, installed copies would never see this or any later release.
          [ "$HAS_SPARKLE_KEY" = true ] || { echo "::error::SPARKLE_PUBLIC_KEY is set but the SPARKLE_PRIVATE_KEY secret is missing."; exit 1; }
          scripts/appcast.sh build/Cra.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Cra-${{ env.CRA_VERSION }}
          path: build/dist/*

      - name: Publish GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.cert.outputs.signed == 'true' }}
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          echo "Cra ${CRA_VERSION} for macOS 14 and later (Apple silicon)." > "$NOTES"
          echo >> "$NOTES"
          # Unsigned builds stay regular releases: releases/latest (the website and
          # scripts/install.sh) skips pre-releases.
          if [ "$SIGNED" = "true" ]; then
            echo "Download \`Cra.dmg\` below, open it and drag Cra to Applications." >> "$NOTES"
          else
            cat .github/release-notes-unsigned.md >> "$NOTES"
          fi
          gh release create "${{ github.ref_name }}" build/dist/* \
            --title "Cra ${CRA_VERSION}" --notes-file "$NOTES" --verify-tag
